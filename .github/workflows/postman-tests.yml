
name: Postman API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  api-tests:
    name: Supabase API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postman collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          npx newman run Backend/postman/ColdTrailApi.postman_collection.json \
            --env-var "base_url=$SUPABASE_URL" \
            --env-var "anon_key=$SUPABASE_ANON_KEY" \
            --env-var "test_email=$TEST_EMAIL" \
            --env-var "test_password=$TEST_PASSWORD"
