# Настройки Gradle для всего проекта.
# Настройки Gradle из среды разработки, например Android Studio, имеют приоритет.
# Подробнее о настройке окружения сборки:
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Аргументы JVM для фонового процесса Gradle, в том числе объём памяти.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Включает экспериментальную параллельную сборку для независимых модулей.
# Подробнее:
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Кеш конфигурации позволяет Gradle пропустить её повторный расчёт, если настройки и скрипты сборки не изменились.
# В этом режиме Gradle также оптимизирует выполнение задач.
org.gradle.configuration-cache=true
# Стиль Kotlin для проекта: "official" или "obsolete".
kotlin.code.style=official