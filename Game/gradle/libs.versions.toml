[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
jetbrainsKotlinJvm = "2.2.10"
javaxInject = "1"
appcompat = "1.6.1"
material = "1.10.0"
room3CommonJvm = "3.0.3"
playServicesDrive = "17.0.0"
room3Runtime = "3.0.3"

turbine = "1.2.1"
mockk = "1.13.13"
